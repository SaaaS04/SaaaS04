name: Generate Snake

on:
  # roda sozinho a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # botao "Run workflow" na aba Actions
  workflow_dispatch:
  # roda tambem a cada push na main
  push:
    branches:
      - main

# da permissao pra Action escrever na branch de saida
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 1) le seu grafico de contribuicoes e gera o SVG da cobrinha
      - name: Gera o SVG da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # cores casadas com a paleta do README (gradiente do pôr do sol)
          # dark e light: o README escolhe pelo tema de quem visita
          # color_dots: 5 cores -> [0 contrib, baixa, media, alta, maxima]
          outputs: |
            dist/github-snake-dark.svg?color_snake=fdeee4&color_dots=2b2140,83477c,bd607c,e2837a,ffc47a
            dist/github-snake-light.svg?color_snake=653a72&color_dots=f3e6ec,e8a0b8,e2837a,bd607c,83477c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2) publica o resultado na branch "output"
      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
